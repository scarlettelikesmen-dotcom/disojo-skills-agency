<title>Disojo // 9:16 Mobile Story Preview</title>
<style>
  body {
    margin: 0;

    display: flex;

    align-items: center;
  }
  h1 { font-size: 24px; margin-bottom: 8px; font-weight: 700; }

    display: flex;
    gap: 40px;
    flex-wrap: wrap;

    <div>
