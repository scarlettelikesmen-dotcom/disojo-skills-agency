<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:"Host Grotesk";src:url("../fonts/HostGrotesk.ttf");font-weight:300 800}
@font-face{font-family:"Host Grotesk";src:url("../fonts/HostGrotesk-Italic.ttf");font-weight:300 800;font-style:italic}
@font-face{font-family:"JetBrains Mono";src:url("../fonts/JetBrainsMono.ttf");font-weight:100 800}
:root{--ink:#E6DDD6;--bg:#131311}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:"Host Grotesk",sans-serif;-webkit-font-smoothing:antialiased}
/* caption layer: y 1100..1580 */
#cap{position:absolute;left:0;top:700px;width:1080px;height:880px}
.row{position:absolute;left:60px;right:60px;top:400px;height:480px;display:flex;justify-content:center;align-items:center;
  font-weight:800;font-size:96px;line-height:1.22;letter-spacing:-.04em;color:var(--ink);text-shadow:0 0 3px rgba(0,0,0,.85),0 2px 10px rgba(0,0,0,.7),0 4px 30px rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
.w{position:relative;isolation:isolate;display:inline-block;padding:0 .15em;white-space:nowrap}
.w .bg{position:absolute;inset:.06em 0 .02em 0;background:var(--ink);border-radius:.2em;z-index:-1;opacity:0}
/* hook layer: y 0..820 */
#top{position:absolute;left:0;top:0;width:1080px;height:820px}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,19,17,.82),rgba(19,19,17,.5) 55%,rgba(19,19,17,0))}
.hook{position:absolute;left:76px;right:76px;top:236px;transform-origin:0 0}
.hook .k{font:500 24px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:20px;margin-bottom:34px}
.hook .k::after{content:"";height:1px;width:110px;background:var(--ink);opacity:.5}
.hook .mask{overflow:hidden;padding:.04em 0 .22em;margin-bottom:-.1em;font-weight:700;font-size:104px;line-height:1.0;letter-spacing:-.045em;color:var(--ink);white-space:nowrap}
.hook .ln{display:inline-block}
.hl{position:relative;display:inline-block;padding:0 .17em;margin:0 -.17em;isolation:isolate}
.hl i{position:absolute;inset:.05em 0 -.13em 0;background:var(--ink);transform-origin:left;transform:scaleX(0);z-index:-1;border-radius:.08em}
.em{font-style:italic;font-weight:600}
.pop{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 6px;width:100%}
.w .mk{position:absolute;inset:.1em -.04em .0em -.04em;background:var(--ink);z-index:-1;transform-origin:left center;transform:scaleX(0) rotate(-1.4deg);border-radius:.1em .3em .12em .26em / .22em .12em .26em .1em;opacity:.98}
.callout{position:absolute;left:0;right:0;top:760px;display:flex;justify-content:center}
.callout .c{position:relative;isolation:isolate;font-weight:800;font-size:170px;line-height:1.1;letter-spacing:-.05em;color:var(--ink);padding:0 .18em;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.callout .c .mk{position:absolute;inset:.08em 0 .0em 0;background:var(--ink);z-index:-1;transform-origin:left center;border-radius:.1em .3em .12em .26em / .22em .12em .26em .1em}
.hl .dk{position:absolute;inset:0;padding:0 .17em;color:var(--bg);clip-path:inset(0 100% 0 0)}

/* info cards: dark floating card with a tiny animated illustration, top third (clear of captions) */
.card{position:absolute;left:76px;top:236px;width:620px;border-radius:34px;padding:22px 28px 24px;background:rgba(19,19,17,.86);border:1px solid rgba(230,221,214,.2);box-shadow:0 16px 48px rgba(0,0,0,.45);transform-origin:0 0;color:var(--ink)}
.card .lb{font:500 19px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.7;display:flex;align-items:center;gap:14px}
.card .lb::after{content:"";height:1px;width:70px;background:var(--ink);opacity:.45}
.card .gw{position:relative;width:564px;height:153px;margin:16px 0 14px;border-radius:18px;overflow:hidden;background:rgba(230,221,214,.06)}
.card .gfx{position:absolute;left:0;top:0;width:856px;height:232px;transform:scale(.66);transform-origin:0 0}
.card .tx{font-weight:700;font-size:42px;letter-spacing:-.04em;line-height:1.05}
.card .tx i{font-style:italic;font-weight:600}
.card svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.card .pill{position:absolute;border:2px solid var(--ink);border-radius:999px;font-weight:700;font-size:30px;letter-spacing:-.03em;padding:14px 26px;white-space:nowrap;background:rgba(19,19,17,.6)}
.card .pill.on{background:var(--ink);color:var(--bg)}
.card .cap2{position:absolute;font:500 20px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;opacity:.75;text-align:center;width:260px}
</style>
<body><div id="top"></div><div id="cap"></div>
<script>
const OUT="cubic-bezier(.23,1,.32,1)", IO="cubic-bezier(.77,0,.175,1)", POP="cubic-bezier(.2,1.25,.4,1)", LIN="linear";
const ms=s=>Math.round(s*1000);
let ANIMS=[];
// real spring physics baked into a CSS linear() easing (overshoot + settle). k=stiffness c=damping
function spring(k=260,c=17,m=1){let x=1,v=0,dt=1/480,t=0,pts=[0],settled=0;
  while(t<2){const a=(-k*x-c*v)/m;v+=a*dt;x+=v*dt;t+=dt;pts.push(1-x);if(Math.abs(x)<.0006&&Math.abs(v)<.008){settled=t;break}}
  if(!settled)settled=t;const n=48,out=[];for(let i=0;i<=n;i++){out.push(pts[Math.min(pts.length-1,Math.round(i/n*(pts.length-1)))].toFixed(4))}
  out[n]="1";return{easing:"linear("+out.join(",")+")",ms:Math.round(settled*1000)}}
const SP_POP=spring(300,17), SP_SOFT=spring(220,20);
function A(el,kf,o){const a=el.animate(kf,Object.assign({fill:"both",easing:OUT},o));a.pause();ANIMS.push(a);return a}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function build(spec){
  const cap=document.getElementById("cap"), top=document.getElementById("top");
  /* ---- captions ---- */
  const style=spec.captionStyle||"marker";
  (spec.captions||[]).forEach(c=>{
    const row=document.createElement("div");row.className="row";cap.appendChild(row);
    const pop=document.createElement("div");pop.className="pop";row.appendChild(pop);
    const dur=c.t1-c.t0;
    // row: fade/blur in, hold, quick exit. Effect easing LINEAR so hold/exit offsets are not warped; ease per segment.
    A(row,[{opacity:0,filter:"blur(6px)",offset:0,easing:OUT},
           {opacity:1,filter:"blur(0)",offset:Math.min(.4,.2/dur),easing:LIN},
           {opacity:1,filter:"blur(0)",offset:Math.max(.5,1-.13/dur),easing:LIN},
           {opacity:0,filter:"blur(3px)",offset:1}],{duration:ms(dur),delay:ms(c.t0),easing:LIN});
    // pop: spring scale + lift (small bounce)
    A(pop,[{transform:"translateY(22px) scale(.86)"},{transform:"translateY(0) scale(1)"}],{duration:SP_POP.ms,delay:ms(c.t0),easing:SP_POP.easing});
    const spans=c.words.map(w=>{const sp=document.createElement("span");sp.className="w";
      sp.innerHTML=(style==="pill"?'<i class="bg"></i>':(w.emph?'<i class="mk"></i>':""))+esc(w.w);pop.appendChild(sp);return sp});
    spans.forEach((sp,i)=>{
      const w=c.words[i], ts=Math.max(w.s,c.t0), te=(i<c.words.length-1?c.words[i+1].s:Math.max(w.e,c.t1-.06));
      if(style==="pill"){
        const bg=sp.querySelector(".bg");
        A(bg,[{opacity:0,transform:"scale(.9)"},{opacity:1,transform:"scale(1)"}],{duration:110,delay:ms(ts),easing:OUT});
        A(bg,[{opacity:1},{opacity:0}],{duration:90,delay:ms(te),easing:LIN,fill:"forwards"});
        A(sp,[{color:"#E6DDD6"},{color:"#131311"}],{duration:90,delay:ms(ts),easing:LIN});
        A(sp,[{color:"#131311"},{color:"#E6DDD6"}],{duration:90,delay:ms(te),easing:LIN,fill:"forwards"});
      } else if(w.emph){
        // highlighter: marker sweeps across the word as it is spoken, text flips dark once the marker is under it
        const mk=sp.querySelector(".mk");
        A(mk,[{transform:"scaleX(0) rotate(-1.4deg)"},{transform:"scaleX(1) rotate(-1.4deg)"}],{duration:SP_SOFT.ms>380?380:SP_SOFT.ms,delay:ms(ts)-40,easing:SP_SOFT.easing});
        A(sp,[{color:"#E6DDD6"},{color:"#131311"}],{duration:110,delay:ms(ts)+70,easing:LIN});
      }
    });
  });
  /* ---- callouts: big fact/number pops, only for things actually said on camera ---- */
  (spec.callouts||[]).forEach(k=>{
    const el=document.createElement("div");el.className="callout";const dur=k.t1-k.t0;
    el.innerHTML='<div class="c"><i class="mk"></i>'+esc(k.text)+'</div>';cap.appendChild(el);
    // callout y is in full-frame coordinates (default 900); #cap starts at y=700
    el.style.top=((k.y!=null?k.y:900)-700)+"px";
    const c=el.firstChild,mk=c.querySelector(".mk");
    A(el,[{opacity:0,offset:0,easing:OUT},{opacity:1,offset:Math.min(.3,.15/dur),easing:LIN},{opacity:1,offset:Math.max(.6,1-.13/dur),easing:LIN},{opacity:0,offset:1}],{duration:ms(dur),delay:ms(k.t0),easing:LIN});
    A(c,[{transform:"translateY(26px) scale(.8)"},{transform:"translateY(0) scale(1)"}],{duration:SP_POP.ms,delay:ms(k.t0),easing:SP_POP.easing});
    A(mk,[{transform:"scaleX(0)"},{transform:"scaleX(1)"}],{duration:300,delay:ms(k.t0)+140,easing:SP_SOFT.easing});
    A(c,[{color:"#E6DDD6"},{color:"#131311"}],{duration:110,delay:ms(k.t0)+230,easing:LIN,composite:"replace"});
  });

  /* ---- info cards (top layer) ---- */
  (spec.cards||[]).forEach(k=>{
    const dur=k.t1-k.t0, d0=ms(k.t0);
    const card=document.createElement("div");card.className="card";
    card.innerHTML='<div class="lb">'+esc(k.label||"")+'</div><div class="gw"><div class="gfx"></div></div><div class="tx">'+esc(k.text||"").replace(/\*([^*]+)\*/g,"<i>$1</i>")+'</div>';
    if(k.y!=null)card.style.top=k.y+"px";if(k.side==="right"){card.style.left="auto";card.style.right="76px";card.style.transformOrigin="100% 0"}
    top.appendChild(card);const g=card.querySelector(".gfx");
    // enter: spring + blur, idle drift, quick exit (exit shorter than enter)
    A(card,[{opacity:0,filter:"blur(8px)",transform:"translateY(-26px) scale(.94)",offset:0,easing:OUT},
            {opacity:1,filter:"blur(0)",transform:"translateY(0) scale(1)",offset:Math.min(.3,.3/dur),easing:LIN},
            {opacity:1,filter:"blur(0)",transform:"translateY(0) scale(1.012)",offset:Math.max(.6,1-.16/dur),easing:LIN},
            {opacity:0,filter:"blur(4px)",transform:"translateY(-10px) scale(1.012)",offset:1}],{duration:ms(dur),delay:d0,easing:LIN});
    const T=(el,kf,o)=>A(el,kf,Object.assign({delay:d0+(o.at||0)},o));
    const draw=(path,at,dur2,ease)=>{path.setAttribute("pathLength","1");path.style.strokeDasharray="1";T(path,[{strokeDashoffset:1},{strokeDashoffset:0}],{duration:dur2,at,easing:ease||OUT})};
    const svg=(inner)=>{g.insertAdjacentHTML("beforeend",'<svg viewBox="0 0 856 232" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>');return g.querySelector("svg")};
    const st='fill="none" stroke="#E6DDD6" stroke-linecap="round" stroke-linejoin="round"';
    if(k.type==="clean"){            // tangled line resolves into a clean line
      const sv=svg('<path class="tg" d="M30 120 C 150 6, 200 226, 130 150 S 290 8, 330 150 S 270 224, 440 100 S 600 6, 560 130 S 700 222, 740 110 S 800 50, 826 116" '+st+' stroke-width="7" opacity=".55"/><path class="cl" d="M30 116 H 826" '+st+' stroke-width="10"/><circle class="dt" cx="826" cy="116" r="15" fill="#E6DDD6"/>');
      const tg=sv.querySelector(".tg"),cl=sv.querySelector(".cl"),dt=sv.querySelector(".dt");
      draw(tg,150,620,IO);
      T(tg,[{opacity:.55,transform:"scaleY(1)"},{opacity:0,transform:"scaleY(.05)"}],{duration:380,at:950,easing:IO,fill:"forwards"});
      tg.style.transformOrigin="50% 50%";tg.style.transformBox="fill-box";
      draw(cl,1050,520,OUT);
      T(dt,[{transform:"scale(0)"},{transform:"scale(1)"}],{duration:SP_POP.ms,at:1500,easing:SP_POP.easing});dt.style.transformOrigin="826px 116px";
    } else if(k.type==="balance"){   // business outweighs money
      const sv=svg('<polygon points="428,168 396,226 460,226" fill="#E6DDD6" opacity=".85"/><g class="bm" style="transform-origin:428px 168px"><rect x="150" y="160" width="556" height="10" rx="5" fill="#E6DDD6"/><circle cx="214" cy="106" r="50" fill="#E6DDD6"/><circle cx="650" cy="134" r="26" fill="none" stroke="#E6DDD6" stroke-width="7"/></g>');
      T(sv.querySelector(".bm"),[{transform:"rotate(7deg)"},{transform:"rotate(-8deg)"}],{duration:SP_POP.ms+200,at:260,easing:spring(120,9).easing});
      g.insertAdjacentHTML("beforeend",'<div class="cap2" style="left:84px;top:12px">'+esc(k.a||"")+'</div><div class="cap2" style="left:520px;top:12px">'+esc(k.b||"")+'</div>');
      T(g.querySelectorAll(".cap2")[0],[{opacity:0,transform:"translateY(-8px)"},{opacity:.75,transform:"translateY(0)"}],{duration:300,at:500});
      T(g.querySelectorAll(".cap2")[1],[{opacity:0,transform:"translateY(-8px)"},{opacity:.75,transform:"translateY(0)"}],{duration:300,at:600});
    } else if(k.type==="loop"){      // you get business -> we get business, a two-way loop
      const sv=svg('<path class="a1" d="M330 82 C 400 16, 456 16, 526 82" '+st+' stroke-width="7"/><path class="a2" d="M526 150 C 456 216, 400 216, 330 150" '+st+' stroke-width="7"/><path class="h1" d="M510 66 L 530 86 L 502 94" '+st+' stroke-width="7"/><path class="h2" d="M346 166 L 326 146 L 354 138" '+st+' stroke-width="7"/>');
      g.insertAdjacentHTML("beforeend",'<div class="pill on" style="left:26px;top:80px">'+esc(k.a||"You")+'</div><div class="pill" style="right:26px;top:80px">'+esc(k.b||"Us")+'</div>');
      const pl=g.querySelectorAll(".pill");
      T(pl[0],[{transform:"scale(.85)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:SP_POP.ms,at:150,easing:SP_POP.easing});
      draw(sv.querySelector(".a1"),500,420);T(sv.querySelector(".h1"),[{opacity:0},{opacity:1}],{duration:120,at:880,easing:LIN});
      T(pl[1],[{transform:"scale(.85)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:SP_POP.ms,at:800,easing:SP_POP.easing});
      T(pl[1],[{background:"rgba(19,19,17,.6)",color:"#E6DDD6"},{background:"#E6DDD6",color:"#131311"}],{duration:140,at:1000,easing:LIN,composite:"replace"});
      draw(sv.querySelector(".a2"),1150,420);T(sv.querySelector(".h2"),[{opacity:0},{opacity:1}],{duration:120,at:1530,easing:LIN});
      T(pl[0],[{transform:"scale(1)"},{transform:"scale(1.06)"},{transform:"scale(1)"}],{duration:380,at:1600,easing:OUT});
    } else if(k.type==="rise"){      // line climbs, area fills, end dot pops. Illustration only: no axes, no numbers.
      const sv=svg('<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6DDD6" stop-opacity=".28"/><stop offset="1" stop-color="#E6DDD6" stop-opacity="0"/></linearGradient></defs><path class="ar" d="M30 206 C 170 196, 230 176, 310 140 S 470 120, 550 84 S 730 52, 826 24 L 826 232 L 30 232 Z" fill="url(#gr)" stroke="none"/><path class="ln" d="M30 206 C 170 196, 230 176, 310 140 S 470 120, 550 84 S 730 52, 826 24" '+st+' stroke-width="10"/><circle class="dt" cx="826" cy="24" r="15" fill="#E6DDD6"/>');
      T(sv.querySelector(".ar"),[{opacity:0},{opacity:1}],{duration:700,at:500,easing:OUT});
      draw(sv.querySelector(".ln"),200,950,OUT);
      T(sv.querySelector(".dt"),[{transform:"scale(0)"},{transform:"scale(1)"}],{duration:SP_POP.ms,at:1050,easing:SP_POP.easing});sv.querySelector(".dt").style.transformOrigin="826px 24px";
    }
  });
  /* ---- hook ---- */
  const h=spec.hook;
  if(h){
    const dur=h.t1-h.t0;
    const scrim=document.createElement("div");scrim.className="scrim";top.appendChild(scrim);
    A(scrim,[{opacity:0},{opacity:1,offset:.12},{opacity:1,offset:1-.12/dur*1},{opacity:0}],{duration:ms(dur),delay:ms(h.t0),easing:LIN});
    const box=document.createElement("div");box.className="hook";top.appendChild(box);
    box.innerHTML='<div class="k">'+esc(h.kicker||"")+'</div>';
    const lines=h.text.split("\n").map(t=>{const m=document.createElement("div");m.className="mask";
      m.innerHTML='<span class="ln">'+esc(t).replace(/\*([^*]+)\*/g,'<span class="hl"><i></i><span class="em">$1</span><span class="em dk" aria-hidden="true">$1</span></span>')+'</span>';box.appendChild(m);return m});
    // fit longest line into 928px
    const maxW=Math.max(...lines.map(m=>m.firstChild.getBoundingClientRect().width));
    if(maxW>928){const f=928/maxW;lines.forEach(m=>m.style.fontSize=(104*f)+"px")}
    // box idle drift + exit (exit faster than enter)
    A(box,[{transform:"scale(1)",opacity:1,filter:"blur(0)",offset:0},{transform:"scale(1.018)",opacity:1,filter:"blur(0)",offset:1-.17/dur},
           {transform:"scale(1.02) translateY(-10px)",opacity:0,filter:"blur(4px)",offset:1}],{duration:ms(dur),delay:ms(h.t0),easing:LIN});
    A(box.querySelector(".k"),[{opacity:0,transform:"translateY(8px)"},{opacity:.75,transform:"translateY(0)"}],{duration:300,delay:ms(h.t0)});
    lines.forEach((m,i)=>A(m.firstChild,[{transform:"translateY(105%)",filter:"blur(6px)",opacity:0},{transform:"translateY(0)",filter:"blur(0)",opacity:1}],
      {duration:540,delay:ms(h.t0)+90+i*65,easing:OUT}));
    // the claim lands: highlight wipe + colour flip
    box.querySelectorAll(".hl").forEach(hl=>{
      const at=ms(h.claimAt||h.t0+1.1);
      A(hl.querySelector("i"),[{transform:"scaleX(0)"},{transform:"scaleX(1)"}],{duration:360,delay:at,easing:IO});
      A(hl.querySelector(".dk"),[{clipPath:"inset(0 100% 0 0)"},{clipPath:"inset(0 0% 0 0)"}],{duration:360,delay:at,easing:IO});
    });
  }
}
window.setup=spec=>{ANIMS=[];document.getElementById("cap").innerHTML="";document.getElementById("top").innerHTML="";build(spec)};
window.seek=t=>ANIMS.forEach(a=>a.currentTime=t*1000);
</script>
